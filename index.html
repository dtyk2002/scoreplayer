<h1>악보재생</h1>
<p>악보재생은 MuseScore·MusicXML 악보를 열어 원하는 속도로 연습할 수 있는 개인용 휴대폰·PC 앱입니다. 속도 조절, A–B 구간 반복, 구간 저장을 지원합니다.</p>
<h2>구글 드라이브 동기화</h2>
<p>사용자가 직접 ‘구글 드라이브 연결’을 누른 경우에만, 휴대폰과 PC의 악보 목록과 저장 구간을 사용자 본인의 구글 드라이브에 있는 ‘악보재생 동기화’ 폴더로 맞춥니다. 앱은 자기가 만든 파일만 다룰 수 있는 권한(drive.file)만 사용합니다.</p>
